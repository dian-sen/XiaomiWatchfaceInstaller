name: Verify and Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify tests, lint and APK assembly
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: app/build/reports/

  release:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: release
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.p12
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing secrets; refusing unsigned release'; exit 1; }
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          gradle --no-daemon assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Prepare versioned assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          PRERELEASE=true
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; PRERELEASE=false; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/XiaomiWatchfaceInstaller-$TAG-universal.apk"
          printf 'commit=%s\nrun=%s\nvariant=release\nabi=universal (Kotlin/Java, compatible with arm64-v8a)\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          PRERELEASE: ${{ steps.assets.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes 'Automated verified build. Extraction and external-installer MVP; Band 9 Pro direct BLE installation is NOT implemented or device-tested. Universal APK supports ARM64.' "${args[@]}"
