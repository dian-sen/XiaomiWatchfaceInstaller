name: Verify and Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'
  FLUTTER_REVISION: c197ca5199e9ee5661e865596c9c07294dfab51c
  XMS_REVISION: 6483f939785e9c1dd011465d573931f669a6adab
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  PERSONAL_ABI: arm64-v8a

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk for Android native build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/share/powershell /usr/share/swift "$ANDROID_HOME/system-images"
          for ndk in "$ANDROID_HOME"/ndk/*; do
            if [[ -d "$ndk" && "${ndk##*/}" != '28.2.13676358' ]]; then sudo rm -rf "$ndk"; fi
          done
          df -h /
      - uses: actions/checkout@v4
      - name: Check out pinned XMS Wearable library
        uses: actions/checkout@v4
        with:
          repository: OrPudding/XMS_Wearable_SDK_CleanRoom
          ref: ${{ env.XMS_REVISION }}
          path: android/xms-wearable-lib-cleanroom
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify official Flutter pin
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | python3 -c 'import json, os, pathlib, sys; v=json.load(sys.stdin); assert v["frameworkVersion"] == os.environ["FLUTTER_VERSION"] == json.loads(pathlib.Path(".fvmrc").read_text())["flutter"]; assert v["frameworkRevision"] == os.environ["FLUTTER_REVISION"]'
          test "$(git -C android/xms-wearable-lib-cleanroom rev-parse HEAD)" = "$XMS_REVISION"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare Android SDK for Flutter and native plugins
        run: sdkmanager 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify focused Flutter tests, native tests, lint and debug APK
        run: bash tool/ci_verify.sh --android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            build/app/reports/
            build/xms-wearable-lib/reports/
            build/test-results/

  release:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Free disk for Android native build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/share/powershell /usr/share/swift "$ANDROID_HOME/system-images"
          for ndk in "$ANDROID_HOME"/ndk/*; do
            if [[ -d "$ndk" && "${ndk##*/}" != '28.2.13676358' ]]; then sudo rm -rf "$ndk"; fi
          done
          df -h /
      - uses: actions/checkout@v4
      - name: Check out pinned XMS Wearable library
        uses: actions/checkout@v4
        with:
          repository: OrPudding/XMS_Wearable_SDK_CleanRoom
          ref: ${{ env.XMS_REVISION }}
          path: android/xms-wearable-lib-cleanroom
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify official Flutter pin
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine | python3 -c 'import json, os, pathlib, sys; v=json.load(sys.stdin); assert v["frameworkVersion"] == os.environ["FLUTTER_VERSION"] == json.loads(pathlib.Path(".fvmrc").read_text())["flutter"]; assert v["frameworkRevision"] == os.environ["FLUTTER_REVISION"]'
          test "$(git -C android/xms-wearable-lib-cleanroom rev-parse HEAD)" = "$XMS_REVISION"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare Android SDK for Flutter and native plugins
        run: sdkmanager 'platforms;android-36' 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
      - name: Resolve locked Flutter dependencies
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
      - name: Build and verify signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: release
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.p12
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$SIGNING_STORE_PASSWORD" || {
            echo 'Missing ANDROID_KEYSTORE_BASE64/PASSWORD; refusing release'; exit 1;
          }
          trap 'rm -f "$SIGNING_STORE_FILE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          keytool -list -alias release -keystore "$SIGNING_STORE_FILE" -storepass:env SIGNING_STORE_PASSWORD > /dev/null
          flutter build apk --release --no-pub --target-platform android-arm64
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          python3 - "$RUNNER_TEMP/apk-badging.txt" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          assert re.search(r"package: name='dev\.xiaom\.watchfaceinstaller' versionCode='13' versionName='0\.8\.0'", text), 'Unexpected APK identity/version'
          assert "application-label:'Watchface Studio'" in text, 'Unexpected APK label'
          assert "sdkVersion:'26'" in text, 'Unexpected APK minSdk'
          assert "native-code: 'arm64-v8a'" in text, 'Unexpected APK ABI'
          PY
          python3 tool/verify_apk_abi.py "$APK" --abi arm64-v8a
      - name: Prepare versioned assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          PRERELEASE=true
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; PRERELEASE=false; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/XiaomiWatchfaceInstaller-$TAG-arm64-v8a.apk"
          printf 'commit=%s\nrun=%s\nvariant=release\napplicationId=dev.xiaom.watchfaceinstaller\nversion=0.8.0+13\nflutter=%s\nflutter_commit=%s\nxms_commit=%s\nabi=arm64-v8a\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$FLUTTER_VERSION" "$FLUTTER_REVISION" "$XMS_REVISION" > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.assets.outputs.tag }}
          PRERELEASE: ${{ steps.assets.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --notes 'Watchface Studio 0.8.0 (13), built with Flutter 3.47.9. Signed ARM64 APK; minimum Android 8.0 (API 26). Automated checks do not establish device compatibility.' "${args[@]}"
